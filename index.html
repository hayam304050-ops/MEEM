<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة السلم والثعبان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- الواجهة العلوية -->
        <div id="hud">
            <div class="control-box">
                <label for="lesson-index">اختر المرحلة:</label>
                <select id="lesson-index" onchange="jumpToLesson()"></select>
            </div>
            
            <div id="dice-display">🎲</div>
            
            <div class="action-buttons">
                <button id="ask-btn" onclick="drawQuestion()">اسحب بطاقة 📝</button>
                <button id="dice-btn" onclick="rollDice()" disabled>ارمي النرد 🎲</button>
            </div>
        </div>

        <!-- رقعة اللعبة -->
        <div id="board-container">
            <div id="board"></div>
            <!-- اللاعب -->
            <div id="player"></div>
        </div>

        <!-- رسائل اللعبة -->
        <div id="feedback-message" class="hidden"></div>
    </div>

    <!-- المربع الحواري (الشرح والأسئلة) -->
    <div id="quiz-modal" class="hidden">
        <div class="modal-content">
            
            <!-- قسم الشرح -->
            <div id="lesson-section" class="hidden">
                <h2 id="lesson-title" style="color: #e74c3c;"></h2>
                <div class="lesson-box">
                    <p id="lesson-text"></p>
                </div>
                <button id="understand-btn" onclick="showQuestion()" class="action-btn">استعد للسؤال 🚀</button>
            </div>
            
            <!-- قسم السؤال -->
            <div id="question-section" class="hidden">
                <p id="chapter-branch-label" class="badge"></p>
                <h3 id="question-counter"></h3>
                <h2 id="question-text"></h2>
                <div id="options"></div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
